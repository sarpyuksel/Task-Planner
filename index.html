<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Task Manager & Weekly Planner</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const defaultCategories = [
            { name: "Yazılım", color: "#e2e8f0", text: "#0f172a" },
            { name: "Kitap", color: "#fce7f3", text: "#831843" },
            { name: "Spor", color: "#ffedd5", text: "#7c2d12" }
        ];

        const pastelColors = [
            { color: "#fef3c7", text: "#78350f" }, { color: "#e0e7ff", text: "#312e81" },
            { color: "#fee2e2", text: "#7f1d1d" }, { color: "#dcfce7", text: "#14532d" },
            { color: "#f3e8ff", text: "#581c87" }, { color: "#cffafe", text: "#164e63" }
        ];

        const PRIORITIES = ["Çok Düşük", "Düşük", "Orta", "Yüksek", "Çok Yüksek"];
        const STATUSES = ["Not Started", "In Progress", "Done"];

        const priorityStyles = {
            "Çok Düşük": { bg: "#f8fafc", border: "#cbd5e1", text: "#475569" }, 
            "Düşük": { bg: "#f0f9ff", border: "#7dd3fc", text: "#0369a1" },     
            "Orta": { bg: "#fefce8", border: "#fde047", text: "#a16207" },     
            "Yüksek": { bg: "#fef2f2", border: "#fca5a5", text: "#b91c1c" },    
            "Çok Yüksek": { bg: "#7f1d1d", border: "#ef4444", text: "#ffffff" } 
        };

        const statusStyles = {
            "Not Started": "bg-slate-100 text-slate-600 border-slate-200",
            "In Progress": "bg-blue-100 text-blue-700 border-blue-200",
            "Done": "bg-emerald-100 text-emerald-700 border-emerald-200"
        };

        const DAYS_OF_WEEK = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"];
        const MONTH_NAMES = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

        function App() {
            // --- STATE TANIMLAMALARI VE LOCALSTORAGE ENTEGRASYONU ---
            const [categories, setCategories] = useState(() => {
                const saved = localStorage.getItem("notion_categories");
                return saved ? JSON.parse(saved) : defaultCategories;
            });

            const [tasks, setTasks] = useState(() => {
                const saved = localStorage.getItem("notion_tasks");
                return saved ? JSON.parse(saved) : [];
            });

            const [weeklyPlan, setWeeklyPlan] = useState(() => {
                const saved = localStorage.getItem("notion_weekly_plan");
                return saved ? JSON.parse(saved) : { "Pazartesi": [], "Salı": [], "Çarşamba": [], "Perşembe": [], "Cuma": [], "Cumartesi": [], "Pazar": [] };
            });

            const [habits, setHabits] = useState(() => {
                const saved = localStorage.getItem("notion_habits");
                return saved ? JSON.parse(saved) : [{ id: "habit-1", title: "Su İç (2.5L)" }];
            });

            const [habitLogs, setHabitLogs] = useState(() => {
                const saved = localStorage.getItem("notion_habit_logs");
                return saved ? JSON.parse(saved) : {};
            });

            const [activeView, setActiveView] = useState("tasks"); 
            const [selectedTaskId, setSelectedTaskId] = useState(null);
            const [filterCategory, setFilterCategory] = useState("Hepsi");
            
            // Haftalık plana saat ekleme state'leri
            const [planningDay, setPlanningDay] = useState(null);
            const [startTime, setStartTime] = useState("");
            const [endTime, setEndTime] = useState("");

            // YENİ: Arama Çubuğu State'i (Modal İçin)
            const [planningSearchQuery, setPlanningSearchQuery] = useState("");

            const [showAddForm, setShowAddForm] = useState(false);
            const [newTitle, setNewTitle] = useState("");
            const [newCategory, setNewCategory] = useState(categories[0]?.name || "");
            const [newDetails, setNewDetails] = useState("");
            const [newPriority, setNewPriority] = useState("Orta");
            const [newStatus, setNewStatus] = useState("Not Started");

            const [showAddCategory, setShowAddCategory] = useState(false);
            const [newCategoryName, setNewCategoryName] = useState("");

            const [selectedHabitId, setSelectedHabitId] = useState(habits[0]?.id || null);
            const [showAddHabit, setShowAddHabit] = useState(false);
            const [newHabitTitle, setNewHabitTitle] = useState("");
            const [currentMonth, setCurrentMonth] = useState(new Date());

            // --- TEMA (DARK MODE) STATE'İ ---
            const [isDark, setIsDark] = useState(() => {
                const saved = localStorage.getItem("notion_theme");
                return saved === "dark" ? true : false;
            });

            // Tema değiştiğinde HTML'e class ekle/çıkar ve hafızaya kaydet
            useEffect(() => {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                localStorage.setItem("notion_theme", isDark ? "dark" : "light");
            }, [isDark]);

            const dragItem = useRef(null);
            const dragOverItem = useRef(null);
            const fileInputRef = useRef(null);

            useEffect(() => { localStorage.setItem("notion_categories", JSON.stringify(categories)); }, [categories]);
            useEffect(() => { localStorage.setItem("notion_tasks", JSON.stringify(tasks)); }, [tasks]);
            useEffect(() => { localStorage.setItem("notion_weekly_plan", JSON.stringify(weeklyPlan)); }, [weeklyPlan]);
            useEffect(() => { localStorage.setItem("notion_habits", JSON.stringify(habits)); }, [habits]);
            useEffect(() => { localStorage.setItem("notion_habit_logs", JSON.stringify(habitLogs)); }, [habitLogs]);

            // --- YEDEKLEME FONKSİYONLARI ---
            const exportData = () => {
                const backupData = { categories, tasks, weeklyPlan, habits, habitLogs };
                const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); 
                a.href = url;
                a.download = `premium-backup-${new Date().toISOString().slice(0, 10)}.json`;
                a.click(); 
                URL.revokeObjectURL(url);
            };

            const importData = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        if(importedData.categories) setCategories(importedData.categories);
                        if(importedData.tasks) setTasks(importedData.tasks);
                        if(importedData.habits) setHabits(importedData.habits);
                        if(importedData.habitLogs) setHabitLogs(importedData.habitLogs);
                        if(importedData.weeklyPlan) {
                            const wp = importedData.weeklyPlan;
                            setWeeklyPlan({
                                "Pazartesi": wp["Pazartesi"] || [], 
                                "Salı": wp["Salı"] || wp[Object.keys(wp).find(k => k.includes("al"))] || [],
                                "Çarşamba": wp["Çarşamba"] || wp[Object.keys(wp).find(k => k.includes("amba"))] || [], 
                                "Perşembe": wp["Perşembe"] || wp[Object.keys(wp).find(k => k.includes("embe"))] || [],
                                "Cuma": wp["Cuma"] || [], 
                                "Cumartesi": wp["Cumartesi"] || [], 
                                "Pazar": wp["Pazar"] || []
                            });
                        }
                        alert("Veriler başarıyla yüklendi! 🚀");
                        event.target.value = ""; 
                    } catch (error) { 
                        alert("Hata: Yüklediğiniz dosya geçerli değil."); 
                    }
                };
                reader.readAsText(file);
            };

            // --- DRAG & DROP FONKSİYONLARI ---
            const handleDragStart = (e, day, index) => { 
                dragItem.current = { day, index }; 
                setTimeout(() => { e.target.style.opacity = '0.5'; }, 0); 
            };
            const handleDragEnter = (e, day, index) => { 
                dragOverItem.current = { day, index }; 
            };
            const handleDragEnd = (e) => { 
                e.target.style.opacity = '1'; 
                dragItem.current = null; 
                dragOverItem.current = null; 
            };
            const handleDrop = (e, targetDay) => {
                e.preventDefault();
                if (!dragItem.current) return;
                const sourceDay = dragItem.current.day;
                const sourceIndex = dragItem.current.index;
                let destIndex = weeklyPlan[targetDay].length;
                if (dragOverItem.current && dragOverItem.current.day === targetDay) { 
                    destIndex = dragOverItem.current.index; 
                }
                if (sourceDay === targetDay && sourceIndex === destIndex) return;
                const newPlan = { ...weeklyPlan };
                const itemToMove = newPlan[sourceDay][sourceIndex];
                newPlan[sourceDay].splice(sourceIndex, 1);
                newPlan[targetDay].splice(destIndex, 0, itemToMove);
                setWeeklyPlan(newPlan);
            };

            // --- KATEGORİ & GÖREV CRUD İŞLEMLERİ ---
            const handleAddCategory = (e) => {
                e.preventDefault(); 
                const trimmedName = newCategoryName.trim(); 
                if (!trimmedName) return;
                if (categories.find(c => c.name.toLowerCase() === trimmedName.toLowerCase())) { 
                    alert("Bu kategori mevcut!"); 
                    return; 
                }
                const randomColor = pastelColors[Math.floor(Math.random() * pastelColors.length)];
                setCategories([...categories, { name: trimmedName, color: randomColor.color, text: randomColor.text }]);
                setNewCategoryName(""); 
                setShowAddCategory(false);
            };

            const handleAddTask = (e) => {
                e.preventDefault(); 
                if (!newTitle.trim()) return;
                const newTask = { 
                    id: "task_" + Date.now(), 
                    title: newTitle, 
                    category: newCategory || categories[0].name, 
                    details: newDetails, 
                    priority: newPriority, 
                    status: newStatus, 
                    isTotallyDone: false, 
                    subTasks: [] 
                };
                setTasks([newTask, ...tasks]);
                setNewTitle(""); 
                setNewDetails(""); 
                setNewPriority("Orta"); 
                setNewStatus("Not Started"); 
                setShowAddForm(false);
            };

            const handleDeleteTask = (taskId) => {
                if (window.confirm("Bu görevi silmek istediğinize emin misiniz?")) {
                    setTasks(tasks.filter(t => t.id !== taskId));
                    if (selectedTaskId === taskId) setSelectedTaskId(null);
                    const updatedPlan = { ...weeklyPlan };
                    Object.keys(updatedPlan).forEach(day => { 
                        updatedPlan[day] = updatedPlan[day].filter(item => item.taskId !== taskId); 
                    });
                    setWeeklyPlan(updatedPlan);
                }
            };

            const updateTaskStatus = (taskId, status) => { 
                setTasks(tasks.map(t => t.id === taskId ? { ...t, status } : t)); 
            };
            const updateTaskPriority = (taskId, priority) => { 
                setTasks(tasks.map(t => t.id === taskId ? { ...t, priority } : t)); 
            };
            const updateTaskTitle = (taskId, title) => { 
                setTasks(tasks.map(t => t.id === taskId ? { ...t, title } : t)); 
            };
            const updateTaskDetails = (taskId, details) => { 
                setTasks(tasks.map(t => t.id === taskId ? { ...t, details } : t)); 
            };
            const toggleTotallyDone = (taskId) => { 
                setTasks(tasks.map(t => t.id === taskId ? { ...t, isTotallyDone: !t.isTotallyDone } : t)); 
            };

            // --- ALT GÖREV (SUBTASK) İŞLEMLERİ ---
            const updateSubTaskTitle = (taskId, subTaskId, title) => { 
                setTasks(tasks.map(task => task.id === taskId ? { ...task, subTasks: task.subTasks.map(sub => sub.id === subTaskId ? { ...sub, title } : sub) } : task)); 
            };
            const toggleSubTask = (taskId, subTaskId) => { 
                setTasks(tasks.map(task => task.id === taskId ? { ...task, subTasks: task.subTasks.map(sub => sub.id === subTaskId ? { ...sub, isCompleted: !sub.isCompleted } : sub) } : task)); 
            };
            const addSubTask = (taskId, title) => { 
                if (!title.trim()) return; 
                setTasks(tasks.map(task => task.id === taskId ? { ...task, subTasks: [...task.subTasks, { id: "sub_" + Date.now(), title, isCompleted: false }] } : task)); 
            };
            const deleteSubTask = (taskId, subTaskId) => {
                setTasks(tasks.map(task => task.id === taskId ? { ...task, subTasks: task.subTasks.filter(sub => sub.id !== subTaskId) } : task));
                const updatedPlan = { ...weeklyPlan };
                Object.keys(updatedPlan).forEach(day => { 
                    updatedPlan[day] = updatedPlan[day].filter(item => item.subTaskId !== subTaskId); 
                });
                setWeeklyPlan(updatedPlan);
            };

            // --- ALIŞKANLIK (HABIT) İŞLEMLERİ ---
            const handleAddHabit = (e) => {
                e.preventDefault(); 
                if (!newHabitTitle.trim()) return;
                const newHabit = { id: "habit_" + Date.now(), title: newHabitTitle };
                setHabits([...habits, newHabit]);
                if (!selectedHabitId) setSelectedHabitId(newHabit.id);
                setNewHabitTitle(""); 
                setShowAddHabit(false);
            };

            const handleDeleteHabit = (habitId) => {
                if (window.confirm("Bu alışkanlığı silmek istediğinize emin misiniz?")) {
                    setHabits(habits.filter(h => h.id !== habitId));
                    if (selectedHabitId === habitId) setSelectedHabitId(habits.length > 1 ? habits[0].id : null);
                }
            };

            const toggleHabitStatus = (habitId, dateStr) => {
                setHabitLogs(prev => {
                    const logs = prev[habitId] || {}; 
                    const currentStatus = logs[dateStr];
                    let nextStatus = "done"; 
                    if (currentStatus === "done") nextStatus = "failed"; 
                    else if (currentStatus === "failed") nextStatus = null;
                    const newLogs = { ...prev, [habitId]: { ...logs } };
                    if (nextStatus) { 
                        newLogs[habitId][dateStr] = nextStatus; 
                    } else { 
                        delete newLogs[habitId][dateStr]; 
                    }
                    return newLogs;
                });
            };

            const changeMonth = (offset) => { 
                setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + offset, 1)); 
            };

            const clearDayPlan = (day) => {
                if (window.confirm(`${day} gününün programını tamamen silmek istediğinize emin misiniz?`)) {
                    setWeeklyPlan({ ...weeklyPlan, [day]: [] });
                }
            };

            // YENİ: Arama Çubuğu kapanışta sıfırlanıyor
            const closePlanningModal = () => {
                setPlanningDay(null);
                setPlanningSearchQuery("");
                setStartTime(""); 
                setEndTime(""); 
            };

            // --- SAAT SEÇİCİ İLE HAFTALIK PLANA EKLEME ---
            const addToWeeklyPlan = (day, taskId, subTaskId = null) => {
                let formattedTime = "";
                if (startTime && endTime) {
                    formattedTime = `${startTime} - ${endTime}`;
                } else if (startTime) {
                    formattedTime = startTime;
                }
                
                const newItem = { 
                    id: "wp_" + Date.now(), 
                    taskId, 
                    subTaskId, 
                    status: "Not Started",
                    time: formattedTime 
                };
                setWeeklyPlan({ ...weeklyPlan, [day]: [...weeklyPlan[day], newItem] });
                
                // Kapandığında stateleri sıfırla
                closePlanningModal();
            };

            const updateWeeklyItemStatus = (day, itemId, status) => { 
                setWeeklyPlan({ ...weeklyPlan, [day]: weeklyPlan[day].map(item => item.id === itemId ? { ...item, status } : item) }); 
            };
            const removeFromWeeklyPlan = (day, itemId) => { 
                setWeeklyPlan({ ...weeklyPlan, [day]: weeklyPlan[day].filter(item => item.id !== itemId) }); 
            };

            const currentSelectedTask = tasks.find(t => t.id === selectedTaskId);
            const activeHabit = habits.find(h => h.id === selectedHabitId);

            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let firstDayIndex = new Date(year, month, 1).getDay();
            firstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
            const blankDays = Array.from({ length: firstDayIndex });
            const monthDays = Array.from({ length: daysInMonth }, (_, i) => i + 1);

            // GÜNCELLENMİŞ: Modal (Görev Ekleme) için Arama Filtresi Mantığı
            const filteredPlanningTasks = tasks.filter(t => {
                if (t.isTotallyDone) return false; // Zaten bitmişleri gösterme
                if (!planningSearchQuery) return true; // Arama boşsa hepsini göster
                
                // Türkçe karakterlere duyarlı küçük harfe çevirme
                const query = planningSearchQuery.toLocaleLowerCase('tr-TR');
                const matchTitle = t.title.toLocaleLowerCase('tr-TR').includes(query);
                
                // Alt adımların isimlerini de tarama yeteneği (Smart Search)
                const matchSub = t.subTasks.some(sub => !sub.isCompleted && sub.title.toLocaleLowerCase('tr-TR').includes(query));
                
                return matchTitle || matchSub;
            });

            return (
                <div className={`flex flex-col md:flex-row h-screen overflow-hidden select-none bg-[#fbfbfa] ${isDark ? 'dark' : ''}`}>
                    
                    {/* SOL SIDEBAR */}
                    <div className="w-full md:w-64 bg-white md:border-r border-b border-slate-200 flex flex-col justify-between p-4 shrink-0 z-10 shadow-sm">
                        <div>
                            <div className="hidden md:flex items-center space-x-3 px-3 py-4 mb-6 rounded-xl bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100 shadow-sm">
                                <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-600 to-indigo-600 text-white flex items-center justify-center text-sm font-bold shadow-md">🚀</div>
                                <span className="font-bold text-sm text-slate-800">Premium Alanım</span>
                            </div>
                            
                            <nav className="flex md:flex-col space-x-2 md:space-x-0 md:space-y-2 overflow-x-auto pb-2 md:pb-0 scrollbar-hide">
                                <button onClick={() => setActiveView("tasks")} className={`btn-press flex-1 md:w-full flex items-center justify-center md:justify-start space-x-3 px-4 py-3 text-sm font-semibold rounded-xl transition-all whitespace-nowrap ${activeView === 'tasks' ? 'bg-slate-800 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    <span className="text-lg">🎯</span> <span>Tüm Görevler</span>
                                </button>
                                <button onClick={() => setActiveView("weekly")} className={`btn-press flex-1 md:w-full flex items-center justify-center md:justify-start space-x-3 px-4 py-3 text-sm font-semibold rounded-xl transition-all whitespace-nowrap ${activeView === 'weekly' ? 'bg-slate-800 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    <span className="text-lg">📅</span> <span>Haftalık Program</span>
                                </button>
                                <button onClick={() => { setActiveView("habits"); if(!selectedHabitId && habits.length > 0) setSelectedHabitId(habits[0].id); }} className={`btn-press flex-1 md:w-full flex items-center justify-center md:justify-start space-x-3 px-4 py-3 text-sm font-semibold rounded-xl transition-all whitespace-nowrap ${activeView === 'habits' ? 'bg-slate-800 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    <span className="text-lg">🌱</span> <span>Alışkanlıklar</span>
                                </button>
                                <button onClick={() => setActiveView("settings")} className={`btn-press flex-1 md:w-full flex items-center justify-center md:justify-start space-x-3 px-4 py-3 text-sm font-semibold rounded-xl transition-all whitespace-nowrap ${activeView === 'settings' ? 'bg-slate-800 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    <span className="text-lg">⚙️</span> <span>Ayarlar</span>
                                </button>
                            </nav>
                        </div>
                    </div>

                    {/* ANA EKRAN İÇERİK ALANI */}
                    <div className="flex-1 flex flex-col overflow-hidden relative">
                        
                        {/* 1. GÖREVLER EKRANI */}
                        {activeView === "tasks" && (
                            <div className="flex-1 overflow-y-auto p-4 md:p-10 max-w-5xl w-full mx-auto animate-modal">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 space-y-4 md:space-y-0">
                                    <h1 className="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-800 text-gradient">Görev Havuzu</h1>
                                    <button onClick={() => setShowAddForm(!showAddForm)} className="w-full md:w-auto btn-press bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white text-sm font-bold px-5 py-2.5 rounded-xl shadow-lg shadow-blue-500/30 transition-all">
                                        + Yeni Görev Oluştur
                                    </button>
                                </div>

                                <div className="flex flex-wrap items-center gap-2 mb-6 bg-white p-2 rounded-xl shadow-sm border border-slate-100">
                                    <button onClick={() => setFilterCategory("Hepsi")} className={`btn-press px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${filterCategory === "Hepsi" ? "bg-slate-800 text-white shadow-md" : "text-slate-600 hover:bg-slate-100"}`}>Hepsi</button>
                                    
                                    {categories.map(cat => (
                                        <button key={cat.name} onClick={() => setFilterCategory(cat.name)} style={{ backgroundColor: filterCategory === cat.name ? cat.text : cat.color, color: filterCategory === cat.name ? '#ffffff' : cat.text }} className="btn-press px-4 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm hover:shadow-md">
                                            {cat.name}
                                        </button>
                                    ))}

                                    {showAddCategory ? (
                                        <form onSubmit={handleAddCategory} className="flex items-center space-x-2 ml-0 md:ml-2 mt-2 md:mt-0 animate-modal">
                                            <input type="text" autoFocus value={newCategoryName} onChange={e => setNewCategoryName(e.target.value)} placeholder="Kategori Adı..." className="border border-slate-300 rounded-lg px-3 py-1.5 text-xs outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 w-32 bg-white text-slate-800" />
                                            <button type="submit" className="btn-press text-xs bg-slate-800 text-white px-3 py-1.5 rounded-lg font-bold shadow-sm">Ekle</button>
                                            <button type="button" onClick={() => setShowAddCategory(false)} className="btn-press text-xs text-slate-400 hover:text-slate-600 font-bold px-1">✕</button>
                                        </form>
                                    ) : (
                                        <button onClick={() => setShowAddCategory(true)} className="btn-press px-4 py-1.5 mt-2 md:mt-0 ml-0 md:ml-2 border-2 border-dashed border-slate-200 text-slate-500 rounded-lg text-xs font-bold hover:bg-slate-50 hover:border-slate-300 transition-all">
                                            + Kategori Ekle
                                        </button>
                                    )}
                                </div>

                                {showAddForm && (
                                    <form onSubmit={handleAddTask} className="bg-white border border-slate-200 rounded-2xl p-6 mb-8 shadow-xl shadow-slate-200/50 space-y-5 animate-modal">
                                        <div className="grid grid-cols-1 md:grid-cols-4 gap-5">
                                            <div className="md:col-span-2">
                                                <label className="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Görev Adı</label>

                                                {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                            <select value={currentSelectedTask.priority || "Orta"} onChange={(e) => updateTaskPriority(currentSelectedTask.id, e.target.value)} className="btn-press text-xs font-bold border border-slate-200 rounded-lg px-3 py-2 outline-none cursor-pointer bg-slate-50 shadow-sm transition-colors">
                                                {PRIORITIES.map(p => <option key={p} value={p}>{p}</option>)}
                                            </select>
                                        </div>
                                        <button onClick={() => setSelectedTaskId(null)} className="btn-press bg-slate-100 rounded-full w-10 h-10 flex items-center justify-center text-slate-500 hover:text-slate-900 hover:bg-slate-200 transition-colors">✕</button>
                                    </div>

                                    <div className="flex items-center space-x-4 mb-6 bg-gradient-to-r from-emerald-50 to-emerald-100/50 p-4 rounded-xl border border-emerald-200 shadow-sm transition-all">
                                        <input type="checkbox" checked={currentSelectedTask.isTotallyDone || false} onChange={() => toggleTotallyDone(currentSelectedTask.id)} className="master-checkbox shrink-0" />
                                        <span className="text-sm font-extrabold text-emerald-800">Görevi Tamamen Bitir</span>
                                    </div>

                                    <input type="text" value={currentSelectedTask.title} onChange={(e) => updateTaskTitle(currentSelectedTask.id, e.target.value)} className={`text-3xl font-extrabold mb-4 w-full bg-transparent border border-transparent hover:border-slate-200 focus:bg-white focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none rounded-xl px-2 -ml-2 py-1 transition-all ${currentSelectedTask.isTotallyDone ? 'line-through text-slate-400' : 'text-slate-800'}`} />
                                    
                                    <textarea value={currentSelectedTask.details} onChange={(e) => updateTaskDetails(currentSelectedTask.id, e.target.value)} placeholder="Detaylar, notlar veya linkler ekle..." className="w-full text-sm font-medium text-slate-600 bg-slate-50 p-4 rounded-xl mb-8 border border-slate-200 hover:border-slate-300 focus:bg-white focus:border-indigo-400 focus:ring-4 focus:ring-indigo-50 outline-none transition-all resize-none min-h-[120px]" />
                                    
                                    <h3 className="text-xs font-extrabold uppercase tracking-widest text-slate-400 mb-3">Alt Adımlar</h3>
                                    <input type="text" placeholder="+ Yeni adım ekle (Enter)" onKeyDown={(e) => { if (e.key === 'Enter') { addSubTask(currentSelectedTask.id, e.target.value); e.target.value = ""; } }} className="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm font-medium mb-4 focus:outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-50 shadow-sm transition-all text-slate-800" />
                                    
                                    <div className="flex-1 overflow-y-auto space-y-2 pr-2 scrollbar-hide pb-10">
                                        {currentSelectedTask.subTasks.map(sub => (
                                            <div key={sub.id} className="flex items-center justify-between p-3 rounded-xl bg-slate-50 hover:bg-white border border-slate-100 hover:border-slate-200 hover:shadow-sm group transition-all">
                                                <div className="flex items-center space-x-3 flex-1">
                                                    <input type="checkbox" checked={sub.isCompleted} onChange={() => toggleSubTask(currentSelectedTask.id, sub.id)} className="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 cursor-pointer border-slate-300" />
                                                    <input type="text" value={sub.title} onChange={(e) => updateSubTaskTitle(currentSelectedTask.id, sub.id, e.target.value)} className={`text-sm font-semibold bg-transparent border-none outline-none w-full transition-all ${sub.isCompleted ? 'line-through text-slate-400' : 'text-slate-700'}`} />
                                                </div>
                                                <button onClick={() => deleteSubTask(currentSelectedTask.id, sub.id)} className="btn-press text-red-400 bg-red-50 w-8 h-8 rounded-lg md:opacity-0 group-hover:opacity-100 flex items-center justify-center font-bold ml-2 transition-all">✕</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* PLANLAMA MODALİ VE AKILLI ARAMA ÇUBUĞU */}
                        {planningDay && (
                            <div className="glass-overlay fixed inset-0 flex items-end md:items-center justify-center z-50">
                                <div className="animate-modal bg-white rounded-t-3xl md:rounded-2xl p-6 md:p-8 w-full md:w-[500px] h-[85vh] md:max-h-[85vh] flex flex-col shadow-2xl border border-slate-100">
                                    <div className="flex justify-between items-center mb-5 pb-4 border-b border-slate-100">
                                        <h3 className="font-extrabold text-xl text-slate-800 text-gradient">{planningDay} Planı</h3>
                                        <button onClick={closePlanningModal} className="btn-press bg-slate-100 rounded-full w-10 h-10 flex items-center justify-center text-slate-500 hover:text-slate-900 transition-colors">✕</button>
                                    </div>
                                    
                                    {/* ZAMAN SEÇİCİLER (Başlangıç ve Bitiş) */}
                                    <div className="mb-5 bg-indigo-50/50 border border-indigo-100 p-4 rounded-2xl shadow-sm shrink-0">
                                        <label className="block text-[11px] font-extrabold text-indigo-800 uppercase tracking-widest mb-3">🕒 Zaman Aralığı (Opsiyonel)</label>
                                        <div className="flex items-center space-x-4">
                                            <div className="flex-1">
                                                <span className="text-[10px] font-bold text-slate-400 block mb-1">Başlangıç Saati</span>
                                                <input type="time" value={startTime} onChange={e => setStartTime(e.target.value)} className="w-full bg-white border border-indigo-200 rounded-xl px-3 py-2 text-sm font-bold text-slate-700 focus:border-indigo-500 outline-none shadow-sm transition-all" />
                                            </div>
                                            <span className="text-slate-300 font-bold mt-4">-</span>
                                            <div className="flex-1">
                                                <span className="text-[10px] font-bold text-slate-400 block mb-1">Bitiş Saati</span>
                                                <input type="time" value={endTime} onChange={e => setEndTime(e.target.value)} className="w-full bg-white border border-indigo-200 rounded-xl px-3 py-2 text-sm font-bold text-slate-700 focus:border-indigo-500 outline-none shadow-sm transition-all" />
                                            </div>
                                        </div>
                                    </div>

                                    {/* AKILLI ARAMA ÇUBUĞU (Smart Search) */}
                                    <div className="mb-4 relative shrink-0">
                                        <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                            <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                        </div>
                                        <input 
                                            type="text" 
                                            placeholder="Görev veya alt adım ara..." 
                                            value={planningSearchQuery}
                                            onChange={e => setPlanningSearchQuery(e.target.value)}
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-3 text-sm font-semibold text-slate-700 focus:bg-white focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none transition-all shadow-sm"
                                        />
                                    </div>

                                    {/* FİLTRELENMİŞ GÖREV LİSTESİ */}
                                    <div className="flex-1 overflow-y-auto space-y-4 pb-10 pr-2 scrollbar-hide">
                                        {filteredPlanningTasks.length === 0 ? (
                                            <p className="text-sm font-medium text-center py-10 text-slate-400 bg-slate-50 rounded-xl border border-dashed border-slate-200">Aradığın kriterde aktif görev yok.</p>
                                        ) : (
                                            filteredPlanningTasks.map(task => (
                                                <div key={task.id} className="border border-slate-200 p-4 bg-white rounded-2xl hover:border-indigo-300 hover:shadow-md transition-all">
                                                    <div className="flex justify-between items-center mb-3">
                                                        <span className="text-sm font-extrabold text-slate-800 truncate pr-3 flex-1">{task.title}</span>
                                                        <button onClick={() => addToWeeklyPlan(planningDay, task.id)} className="btn-press shrink-0 bg-slate-800 text-white text-[11px] font-bold px-4 py-2 rounded-xl shadow-md hover:bg-indigo-600 transition-colors">Ana Görev</button>
                                                    </div>
                                                    {task.subTasks.length > 0 && (
                                                        <div className="pl-4 border-l-2 border-slate-100 space-y-2 mt-3 pt-2">
                                                            {task.subTasks.filter(sub => !sub.isCompleted).map(sub => (
    <div key={sub.id} className="flex justify-between text-xs font-semibold text-slate-600 items-center bg-slate-50 p-2 rounded-lg border border-slate-100 hover:border-indigo-200 transition-colors">
                                                                    <span className="truncate pr-2">{sub.title}</span>
                                                                    <button onClick={() => addToWeeklyPlan(planningDay, task.id, sub.id)} className="btn-press shrink-0 text-indigo-600 bg-indigo-50 px-3 py-1 rounded-md hover:bg-indigo-100 transition-colors font-bold">Adım Ekle</button>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
